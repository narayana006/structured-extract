name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Run the examples
        run: |
          python examples/quickstart.py
          structured-extract check examples/model_reply.txt --schema examples/invoice.schema.json --source examples/invoice.txt
          structured-extract run examples/invoice.txt --schema examples/invoice.schema.json --llm-cmd "python examples/fake_llm.py"
